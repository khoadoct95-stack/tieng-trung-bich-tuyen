{% extends "admin/base_site.html" %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="color: #0dcaf0;">🖼️ Gắn ảnh hàng loạt từ file ZIP</h2>
    <p class="text-muted mt-2">
        <b>Quy tắc quan trọng:</b> Tên file ảnh phải được đặt theo mẫu <code>q[số câu].jpg</code>. 
        Ví dụ: Ảnh của câu 1 đặt là <code>q1.jpg</code>, ảnh chung của nhóm câu 11-15 đặt là <code>q11.jpg</code>.
    </p>
    
    <form method="POST" enctype="multipart/form-data" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label class="fw-bold mb-2">1. Chọn Đề thi cần gắn ảnh:</label>
            <select name="exam_id" class="form-control" required>
                <option value="">-- Chọn đề thi --</option>
                {% for exam in exams %}
                    <option value="{{ exam.id }}">{{ exam.title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4">
            <label class="fw-bold mb-2">2. Tải lên file ZIP (.zip):</label>
            <input type="file" name="zip_file" class="form-control" accept=".zip" required>
        </div>

        <button type="submit" class="btn btn-info fw-bold px-4 py-2 text-dark shadow-sm">
            🚀 Bắt đầu Gắn Ảnh
        </button>
    </form>
</div>
{% endblock %}
