{% extends "admin/change_list.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Xóa dấu chấm tròn (bullet) mặc định và căn chỉnh thanh công cụ */
    .object-tools li {
        list-style: none !important;
        margin-left: 10px;
    }
    .object-tools li::before {
        display: none !important;
    }

    /* Thiết kế nút All-in-One chuyên nghiệp */
    .btn-hsk-studio {
        background: linear-gradient(135deg, #059669 0%, #047857 100%) !important;
        color: #ffffff !important;
        font-weight: 700 !important;
        font-size: 0.85rem !important;
        padding: 8px 18px !important;
        border-radius: 8px !important;
        border: 1px solid #047857 !important;
        box-shadow: 0 3px 10px rgba(5, 150, 105, 0.25) !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 8px !important;
        text-decoration: none !important;
        transition: all 0.2s ease-in-out !important;
        letter-spacing: 0.2px !important;
    }

    .btn-hsk-studio:hover {
        background: linear-gradient(135deg, #10B981 0%, #059669 100%) !important;
        transform: translateY(-1px) !important;
        box-shadow: 0 6px 15px rgba(5, 150, 105, 0.35) !important;
        color: #ffffff !important;
    }

    .btn-hsk-studio .badge-sub {
        background: rgba(255, 255, 255, 0.2);
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 0.72rem;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block object-tools-items %}
    <li>
        <a href="{% url 'admin:import_exam_excel' %}" class="btn-hsk-studio">
            <span>⚡ Nhập & Cập nhật Đề thi</span>
            <span class="badge-sub">Excel • Audio • ZIP</span>
        </a>
    </li>
    {{ block.super }}
{% endblock %}
