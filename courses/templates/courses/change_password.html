{% extends 'courses/base.html' %}

{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <div class="text-center mb-4">
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary btn-sm mb-3 rounded-pill px-3">⬅ Quay lại Hồ sơ</a>
                <h3 class="text-custom-red fw-bold">🔐 Đổi mật khẩu</h3>
            </div>
            
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-custom-red w-100 rounded-pill mt-3 fw-bold">Xác nhận đổi mật khẩu</button>
            </form>
        </div>
    </div>
</div>

<style>
    /* Chỉnh lại giao diện form mặc định của Django cho đẹp hơn */
    form p { margin-bottom: 1rem; }
    form label { font-weight: 500; margin-bottom: 0.5rem; color: #555; }
    form input { 
        width: 100%; padding: 0.5rem 1rem; 
        border: 1px solid #ced4da; border-radius: 8px; 
    }
    form input:focus { border-color: var(--primary-red); outline: none; }
    .helptext, ul.errorlist { font-size: 0.85rem; color: #6c757d; margin-top: 5px; list-style: none; padding-left: 0;}
    ul.errorlist { color: #dc3545; }
</style>
{% endblock %}
