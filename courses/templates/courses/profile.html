{% extends 'courses/base.html' %}

{% block title %}Hồ sơ của {{ user.username }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <!-- Header màu đỏ -->
            <div class="bg-custom-primary text-white text-center py-4">
                <div class="display-1 mb-2">🎓</div>
                <h3 class="fw-bold mb-0">{{ user.username }}</h3>
                <small class="opacity-75">Học viên tích cực</small>
            </div>
            
            <!-- Nội dung thông tin -->
            <div class="card-body p-4 text-center">
                <div class="row mb-4">
                    <div class="col-6 border-end">
                        <h5 class="text-muted mb-1">Ngày tham gia</h5>
                        <p class="fw-bold fs-5 text-dark mb-0">{{ user.date_joined|date:"d/m/Y" }}</p>
                    </div>
                    <div class="col-6">
                        <h5 class="text-muted mb-1">Số lượt chơi</h5>
                        <p class="fw-bold fs-5 text-danger mb-0">{{ total_games }} lượt</p>
                    </div>
                </div>

                <!-- Nút thao tác -->
                <div class="d-grid gap-2">
                    <a href="{% url 'change_password' %}" class="btn btn-outline-danger rounded-pill fw-medium">
                        🔐 Đổi mật khẩu
                    </a>
                    <a href="{% url 'dashboard' %}" class="btn btn-light rounded-pill text-dark border">
                        🏆 Xem Bảng Xếp Hạng
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
