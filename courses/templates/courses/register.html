{% extends 'courses/base.html' %}
{% block title %}Đăng ký tài khoản{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4 p-4 mt-4">
            <h3 class="text-center text-custom-red fw-bold mb-4">📝 Tạo Tài Khoản</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-custom-red w-100 rounded-pill mt-3">Đăng ký ngay</button>
            </form>
            <div class="text-center mt-3">
                <small>Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
