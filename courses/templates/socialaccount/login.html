{% extends 'courses/base.html' %}
{% load i18n %}

{% block title %}Đang kết nối Google...{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow-lg border-0 text-center p-5" style="max-width: 450px; width: 100%; border-radius: 20px;">
        <div class="spinner-border text-danger mb-4 mx-auto" role="status" style="width: 3rem; height: 3rem;">
            <span class="sr-only">Đang tải...</span>
        </div>
        <h4 class="fw-bold mb-3" style="color: #B22222;">Đang chuyển hướng...</h4>
        <p class="text-muted mb-4">Vui lòng đợi trong giây lát.</p>

        <!-- Form ẩn chứa nút Continue -->
        <form id="auto-login-form" method="post" action="{% url 'google_login' %}">
            {% csrf_token %}
            <button type="submit" style="display: none;">{% trans "Continue" %}</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
            var form = document.getElementById('auto-login-form');
            if (form) form.submit();
        }, 300);
    });
</script>
{% endblock %}
